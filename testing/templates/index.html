<!DOCTYPE html>
<html>
<head>
    <title>Hex Game with AlphaZero</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #f0f0f0;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #win-probs {
            font-size: 18px;
            width: 650px;
            height: 40px;
            display: flex;
            margin-bottom: 10px;
        }
        #p1-prob, #p2-prob {
            color: white;
            font-weight: bold;
            text-align: center;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #p1-prob { background-color: red; }
        #p2-prob { background-color: blue; }
        svg {
            background-color: white;
            display: block;
            overflow: visible;
        }
        .hexagon {
            stroke: gray;
            stroke-width: 0.03;
            cursor: pointer;
        }
        .button-row {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
        }
        button:hover { background-color: #45a049; }
        #toggle-heatmap.active { background-color: #f39c12; }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="win-probs">
            <span id="p1-prob" style="width:50%">50%</span>
            <span id="p2-prob" style="width:50%">50%</span>
        </div>
        <svg id="board" width="650" height="650"></svg>
        <div class="button-row">
            <button id="toggle-heatmap" class="active">Heatmap: ON</button>
            <button id="reset-button">Reset Game</button>
        </div>
    </div>

    <script>
    // === Configuration ===
    const N = 8;
    const radius = 0.4;
    const dx = Math.sqrt(3) * radius;
    const dy = 1.5 * radius;
    const margin = 0.15;  // tighter fit

    // === SVG & Group Setup ===
    const svg = document.getElementById('board');
    // compute viewBox for diamond
    const minX = -dx/2 - margin;
    const maxX = (3*(N-1)/2)*dx + dx/2 + margin;
    const minY = -(N-1)*dy - radius - margin;
    const maxY = radius + margin;
    svg.setAttribute('viewBox', `${minX} ${minY} ${maxX-minX} ${maxY-minY}`);

    // group for rotation
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const cx = (minX + maxX)/2;
    const cy = (minY + maxY)/2;
    g.setAttribute('transform', `translate(${cx} ${cy}) scale(0.85) rotate(-60) translate(${-cx} ${-cy})`);
    svg.appendChild(g);

    // === Draw Boundaries ===
    function makeLine(x1,y1,x2,y2,stroke) {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', stroke);
      line.setAttribute('stroke-width', 0.15);
      g.appendChild(line);
    }

    // top red line
    const topY = radius + margin;
    makeLine(0, topY, (N-1)*dx, topY, 'red');

    // bottom red line
    const bottomY = -(N-1)*dy - radius - margin;
    makeLine((N-1)*dx/2, bottomY, 3*(N-1)/2*dx, bottomY, 'red');

    const rightXTop = (N-1)*dx + dx/2 + margin;
    const rightYTop = radius/2;
    const rightXBot = 3*(N-1)/2*dx + dx/2 + margin;
    const rightYBot = -(N-1)*dy + radius/2;

    makeLine(rightXTop, rightYTop, rightXBot, rightYBot, 'blue');

    // Left blue line (copy right one, shift left and down)
    const shiftX = -5.8; // - goes left and down
    const shiftY = -0.5; // + goes right and down

    const leftXTop = rightXTop + shiftX;
    const leftYTop = rightYTop + shiftY;
    const leftXBot = rightXBot + shiftX;
    const leftYBot = rightYBot + shiftY;

    makeLine(leftXTop, leftYTop, leftXBot, leftYBot, 'blue');

    

    // === Hex Grid & Interaction ===
    let heatmapEnabled = true;
    let lastData = { occupancy: [], policy: {}, win_probs: [50,50] };

    function makeUserMove(r, c) {
      fetch('/make_move', {
        method: 'POST', credentials: 'same-origin',
        headers: {'Content-Type':'application/x-www-form-urlencoded'},
        body: `move=${r*N + c}`
      })
      .then(r => r.json()).then(data => {
        if (data.error) return;
        lastData = data;
        updateBoard(data.occupancy, data.policy);
        if (data.game_over) {
          const last = data.occupancy.pop();
          updateWinBar(last[2]===1?[100,0]:[0,100]);
        } else updateWinBar(data.win_probs);
      });
    }

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = c*dx + r*(dx/2), y = -r*dy;
        const hex = document.createElementNS('http://www.w3.org/2000/svg','polygon');
        const pts = [0,1,2,3,4,5].map(i => {
          const a = Math.PI/3*i + Math.PI/6;
          return [x + radius*Math.cos(a), y + radius*Math.sin(a)];
        }).map(p=>p.join(',')).join(' ');
        hex.setAttribute('points', pts);
        hex.setAttribute('class','hexagon');
        hex.setAttribute('id',`hex_${r}_${c}`);
        hex.setAttribute('fill','white');
        hex.addEventListener('click', () => makeUserMove(r,c));
        g.appendChild(hex);
      }
    }

    // === Heatmap & Board Update ===
    document.getElementById('toggle-heatmap').onclick = () => {
      heatmapEnabled = !heatmapEnabled;
      const btn = document.getElementById('toggle-heatmap');
      btn.classList.toggle('active', heatmapEnabled);
      btn.textContent = `Heatmap: ${heatmapEnabled?'ON':'OFF'}`;
      updateBoard(lastData.occupancy, lastData.policy);
    };

    function updateBoard(occ, policy) {
      const occMap = new Map(occ.map(([r,c,p])=>[`${r}_${c}`, p]));
      const maxP = heatmapEnabled
                    ? Math.max(...Object.values(policy), 0)
                    : 0;
      document.querySelectorAll('.hexagon').forEach(h => {
        const [r,c] = h.id.split('_').slice(1).map(Number);
        const key = `${r}_${c}`;
        if (occMap.has(key)) {
          h.setAttribute('fill', occMap.get(key)===1?'red':'blue');
        } else if (heatmapEnabled) {
          const p = policy[r*N+c]||0;
          if (p>0.03) {
            const s = Math.floor(255*(1-Math.pow(p/maxP,0.8)));
            h.setAttribute('fill', `rgb(${s},255,${s})`);
          } else h.setAttribute('fill','white');
        } else h.setAttribute('fill','white');
      });
    }

    function updateWinBar([p1,p2]) {
      const p1El = document.getElementById('p1-prob'),
            p2El = document.getElementById('p2-prob');
      p1El.style.width = `${p1}%`;
      p2El.style.width = `${p2}%`;
      p1El.textContent = p1?`${p1}%`:'';
      p2El.textContent = p2?`${p2}%`:'';
    }

    // === Reset & Initial Load ===
    document.getElementById('reset-button').onclick = () => {
      fetch('/make_move',{
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'move=-1'
      }).then(r=>r.json()).then(data=>{
        lastData = data;
        updateBoard(data.occupancy, data.policy);
        updateWinBar(data.win_probs);
      });
    };

    // initial reset
    document.getElementById('reset-button').click();
    </script>
</body>
</html>
